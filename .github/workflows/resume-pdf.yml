name: Resume PDF

# 履歷資料在 wen-hsiu-hsu/resume-data（public repo，GitHub Pages 提供 JSON）。
# 每天檢查一次該 repo main 的 commit，有更新才重新產生 PDF 並 commit，
# push 之後由 Vercel 自動部署
on:
    schedule:
        - cron: "0 18 * * *" # 台灣時間 02:00
    workflow_dispatch:

permissions:
    contents: write

env:
    VERSION_FILE: .github/resume-pdf-data-version

jobs:
    generate:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4

            # resume-data 是 public repo，git ls-remote 不需要認證
            - name: Check data version
              id: data
              run: |
                  set -o pipefail
                  version=$(git ls-remote https://github.com/wen-hsiu-hsu/resume-data.git refs/heads/main | cut -f1)
                  [ -n "$version" ]
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  if [ "$version" = "$(cat "$VERSION_FILE" 2>/dev/null)" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

            - uses: actions/setup-node@v4
              if: steps.data.outputs.changed == 'true'
              with:
                  node-version-file: .tool-versions
                  cache: npm

            - name: Build
              if: steps.data.outputs.changed == 'true'
              run: |
                  npm ci
                  npm run build

            - name: Generate PDF
              if: steps.data.outputs.changed == 'true'
              env:
                  CHROME_PATH: /usr/bin/google-chrome
              run: |
                  node .output/server/index.mjs &
                  npx --yes wait-on@8 --timeout 60000 http://localhost:3000/resume
                  node scripts/generate-pdf.mjs

            - name: Commit
              if: steps.data.outputs.changed == 'true'
              run: |
                  echo "${{ steps.data.outputs.version }}" > "$VERSION_FILE"
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add public/resume-*.pdf "$VERSION_FILE"
                  git diff --cached --quiet || git commit -m "chore: 更新履歷 PDF"
                  git push
